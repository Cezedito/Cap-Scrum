<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cap Scrum</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cap Scrum">
<meta name="theme-color" content="#F9F8F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1430" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Montserrat:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
/* layout: Bento éditorial (fond crème, marine, terracotta) + structure iOS (grand titre, listes groupées) + dock Liquid Glass flottant */
:root{
  --bg:#F9F8F6; --surface:#FFFFFF; --surface2:rgba(0,32,91,.05); --ink:#00205B; --muted:rgba(0,32,91,.6); --line:rgba(0,32,91,.08); --hair:rgba(0,32,91,.05);
  --accent:#E2725B; --accent-soft:rgba(226,114,91,.13); --link:#B94E39;
  --cta:#C2543E; --cta-ink:#FFFFFF;
  --navy-card:#00205B; --on-navy:#F9F8F6; --on-navy-muted:rgba(249,248,246,.65); --navy-track:rgba(249,248,246,.16);
  --icon-bg:rgba(0,32,91,.06);
  --good:#2F9E66; --good-ink:#1E7A4C; --good-bg:rgba(47,158,102,.12);
  --bad:#D1364A; --bad-ink:#B02236; --bad-bg:rgba(209,54,74,.10);
  --warn:#E2725B; --warn-ink:#B94E39; --warn-bg:rgba(226,114,91,.13);
  --shadow:0 8px 30px rgba(0,0,0,.03),0 1px 2px rgba(0,32,91,.03);
  --shadow-hi:0 14px 40px rgba(0,32,91,.12),0 2px 6px rgba(0,32,91,.06);
  --glass:rgba(255,255,255,.55); --glass-edge:rgba(255,255,255,.9); --glass-low:rgba(0,32,91,.06); --glass-shadow:0 12px 34px rgba(0,32,91,.14),0 2px 6px rgba(0,32,91,.06);
  --amb1:rgba(226,114,91,.10); --amb2:rgba(0,32,91,.06);
  --f-display:"Montserrat","Avenir Next",-apple-system,system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Roboto",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.42,.64,1); --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1430; --surface:#121E42; --surface2:rgba(244,241,236,.07); --ink:#F4F1EC; --muted:rgba(244,241,236,.62); --line:rgba(244,241,236,.10); --hair:rgba(244,241,236,.07);
  --accent:#EE8A73; --accent-soft:rgba(238,138,115,.16); --link:#F09A85;
  --cta:#EE8A73; --cta-ink:#0A1430;
  --navy-card:#1B2C5E; --on-navy:#F4F1EC; --on-navy-muted:rgba(244,241,236,.65); --navy-track:rgba(244,241,236,.14);
  --icon-bg:rgba(244,241,236,.08);
  --good:#4CC488; --good-ink:#6BD49D; --good-bg:rgba(76,196,136,.16);
  --bad:#F06478; --bad-ink:#F58495; --bad-bg:rgba(240,100,120,.16);
  --warn:#EE8A73; --warn-ink:#F09A85; --warn-bg:rgba(238,138,115,.16);
  --shadow:0 8px 30px rgba(0,0,0,.35); --shadow-hi:0 16px 44px rgba(0,0,0,.5);
  --glass:rgba(22,34,72,.5); --glass-edge:rgba(255,255,255,.18); --glass-low:rgba(255,255,255,.06); --glass-shadow:0 14px 36px rgba(0,0,0,.5);
  --amb1:rgba(238,138,115,.12); --amb2:rgba(80,110,200,.16);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1430; --surface:#121E42; --surface2:rgba(244,241,236,.07); --ink:#F4F1EC; --muted:rgba(244,241,236,.62); --line:rgba(244,241,236,.10); --hair:rgba(244,241,236,.07);
  --accent:#EE8A73; --accent-soft:rgba(238,138,115,.16); --link:#F09A85;
  --cta:#EE8A73; --cta-ink:#0A1430;
  --navy-card:#1B2C5E; --on-navy:#F4F1EC; --on-navy-muted:rgba(244,241,236,.65); --navy-track:rgba(244,241,236,.14);
  --icon-bg:rgba(244,241,236,.08);
  --good:#4CC488; --good-ink:#6BD49D; --good-bg:rgba(76,196,136,.16);
  --bad:#F06478; --bad-ink:#F58495; --bad-bg:rgba(240,100,120,.16);
  --warn:#EE8A73; --warn-ink:#F09A85; --warn-bg:rgba(238,138,115,.16);
  --shadow:0 8px 30px rgba(0,0,0,.35); --shadow-hi:0 16px 44px rgba(0,0,0,.5);
  --glass:rgba(22,34,72,.5); --glass-edge:rgba(255,255,255,.18); --glass-low:rgba(255,255,255,.06); --glass-shadow:0 14px 36px rgba(0,0,0,.5);
  --amb1:rgba(238,138,115,.12); --amb2:rgba(80,110,200,.16);
  color-scheme:dark;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100%;background:transparent;color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:17px;line-height:1.42;letter-spacing:-.3px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 32% at 85% 8%,var(--amb1),transparent 70%),radial-gradient(45% 40% at 10% 90%,var(--amb2),transparent 70%),var(--bg)}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(120px + env(safe-area-inset-bottom))}
body.inquiz .app{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
header.top{padding:18px 4px 14px}
header.top span{display:block;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
header.top h1{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:40px;letter-spacing:-.8px;margin:4px 0 0;color:var(--ink)}
h2{font-family:var(--f-body);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:28px 8px 10px}
h3{font-family:var(--f-body);font-weight:600;font-size:17px;letter-spacing:-.3px;margin:0 0 2px;text-wrap:balance;color:var(--ink)}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.tag{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:-.08px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}

/* bento */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.span2{grid-column:1 / -1}
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:26px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0;text-align:left}
.tile .kpi{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.tile .kpi small{font-family:var(--f-body);font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:3px}
.tile.navy{background:var(--navy-card);color:var(--on-navy);border-color:transparent;box-shadow:var(--shadow-hi);position:relative;overflow:hidden}
.tile.navy::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(226,114,91,.35),transparent 70%);pointer-events:none}
.tile.navy .tag{color:var(--on-navy-muted)}
.hero-num{display:flex;align-items:baseline;gap:10px}
.hero-num b{font-family:var(--f-display);font-weight:800;font-size:68px;line-height:.95;letter-spacing:-2.5px;font-variant-numeric:tabular-nums}
.hero-num small{font-size:16px;font-weight:600;color:var(--on-navy-muted)}
.tile.navy .meter{background:var(--navy-track)}
.tile.navy .meter u{background:var(--on-navy)}
.tile.navy .meter-legend{color:var(--on-navy-muted)}
.tile.navy p{color:var(--on-navy-muted);margin:0;font-size:15px}
.ico{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--icon-bg);color:var(--ink)}
.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.cta{background:var(--cta);color:var(--cta-ink)}
.cont{flex-direction:row;align-items:center;gap:14px;border:1px solid var(--hair);cursor:pointer;font:inherit;color:inherit}
.cont .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cont .txt b{font-weight:600;font-size:16px;line-height:1.3}
.chev{flex:none;width:8px;height:8px;border-top:2px solid var(--muted);border-right:2px solid var(--muted);transform:rotate(45deg);opacity:.7;margin-right:4px}

/* score (résultats) */
.score{display:flex;flex-direction:column;gap:12px}
.score .big{display:flex;align-items:baseline;gap:8px}
.score .big b{font-family:var(--f-display);font-size:60px;font-weight:800;line-height:1;letter-spacing:-2px;font-variant-numeric:tabular-nums}
.score .big small{font-size:16px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{position:relative;height:8px;border-radius:99px;background:var(--surface2)}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter u{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--ink);opacity:.5}
.meter-legend{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}

/* boutons */
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;width:100%;padding:14px 20px;border-radius:18px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);font-weight:600;font-size:17px;text-align:center;box-shadow:var(--shadow)}
.btn.primary{background:var(--cta);color:var(--cta-ink);border-color:transparent;box-shadow:0 8px 22px color-mix(in srgb,var(--cta) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.22)}
.btn[disabled]{opacity:.35;cursor:default}
.back{background:none;border:0;padding:8px 0;min-height:44px;color:var(--link);font-size:17px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* pastilles */
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:0;padding:4px 10px;border-radius:99px;background:var(--icon-bg);color:var(--ink);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good-ink)} .pill.bad{background:var(--bad-bg);color:var(--bad-ink)} .pill.warn{background:var(--warn-bg);color:var(--warn-ink)} .pill.neutral{background:var(--surface2);color:var(--muted)}

/* modules */
.mod{display:grid;grid-template-columns:48px 1fr 12px;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.mod::after{content:"";width:8px;height:8px;border-top:2px solid var(--muted);border-right:2px solid var(--muted);transform:rotate(45deg);opacity:.6}
.mod .num{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;background:var(--icon-bg)!important;color:var(--ink)}
.mod.done .num{background:var(--good-bg)!important;color:var(--good-ink)}
.mod .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mod .sub{font-size:15px;color:var(--muted);letter-spacing:-.2px}
.prog{height:5px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.mod.done .prog i{background:var(--good)}

/* leçons : liste groupée */
.stack.list{gap:0;background:var(--surface);border:1px solid var(--hair);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.les{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;padding:14px 18px;min-height:56px;position:relative}
.les + .les::before{content:"";position:absolute;top:0;left:60px;right:0;height:1px;background:var(--hair)}
.les .dot{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--icon-bg);color:var(--ink)}
.les.read .dot{background:var(--good-bg);color:var(--good-ink)}
.les b{font-weight:600}
.les .min{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* lecteur */
.reader h1{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:35px;letter-spacing:-.8px;margin:6px 0 18px;text-wrap:balance}
.reader > p{font-size:17px;line-height:1.5}
.box{border-radius:22px;padding:18px 20px;margin:16px 0}
.box .lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:block}
.box.ex{background:var(--navy-card);color:var(--on-navy)} .box.ex .lab{color:var(--accent)}
.box.trap{background:var(--accent-soft)} .box.trap .lab{color:var(--link)}
.box.key{background:var(--surface);border:1px solid var(--hair);box-shadow:var(--shadow)} .box.key .lab{color:var(--good-ink)}
.box ul{margin:0;padding-left:20px} .box li{margin-bottom:6px}
.box li:last-child{margin-bottom:0} .box p{margin:0}
.defs{display:flex;flex-direction:column;margin:16px 0;background:var(--surface);border:1px solid var(--hair);border-radius:22px;padding:2px 20px;box-shadow:var(--shadow)}
.defs div{padding:14px 0;border-top:1px solid var(--hair);color:var(--muted);font-size:15px;letter-spacing:-.2px} .defs div:first-child{border-top:0}
.defs b{display:block;font-family:var(--f-display);font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.3px;margin-bottom:3px}
.pairs{display:grid;grid-template-columns:1fr 1fr;margin:16px 0;background:var(--surface);border:1px solid var(--hair);border-radius:22px;padding:2px 20px;box-shadow:var(--shadow)}
.pairs div{padding:12px 0;border-top:1px solid var(--hair)} .pairs div:nth-child(-n+2){border-top:0}
.pairs div:nth-child(2n){text-align:right;font-weight:700}
.pairs .h{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
.readnav{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-top:26px}

/* quiz */
.qbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.segs{display:flex;gap:3px;margin:2px 0 16px}
.segs i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.segs i.ok{background:var(--good)} .segs i.ko{background:var(--bad)} .segs i.cur{background:var(--accent)} .segs i.ans{background:var(--muted)}
.timer{font-size:15px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--hair);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad-ink);background:var(--bad-bg)}
.qtext{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:29px;letter-spacing:-.5px;margin:14px 0 6px;text-wrap:balance}
.qhint{font-size:15px;color:var(--muted);margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:14px;align-items:center;text-align:left;min-height:58px;padding:14px 16px;border-radius:20px;border:1.5px solid var(--hair);background:var(--surface);box-shadow:var(--shadow)}
.opt .l{font-family:var(--f-display);font-size:14px;font-weight:800;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:var(--icon-bg);color:var(--ink)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)} .opt.sel .l{background:var(--cta);color:var(--cta-ink)}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.ok .l{background:var(--good);color:#fff}
.opt.ko{border-color:var(--bad);background:var(--bad-bg)} .opt.ko .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.feedback{margin-top:16px;border-radius:22px;padding:18px 20px;background:var(--surface);border:1px solid var(--hair)}
.feedback.good{background:var(--good-bg);border-color:transparent} .feedback.bad{background:var(--bad-bg);border-color:transparent}
.feedback b.v{display:block;font-family:var(--f-display);font-size:18px;font-weight:800;margin-bottom:4px}
.actions{margin-top:18px;display:flex;flex-direction:column;gap:12px}

/* repli */
details{background:var(--surface);border:1px solid var(--hair);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
details+details{margin-top:12px}
summary{list-style:none;min-height:58px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--f-display);font-size:17px;font-weight:700;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-4px;transition:transform .3s var(--spring)}
details[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.dbody{padding:0 20px 20px}
.dbody ul{margin:0;padding-left:20px} .dbody li{margin-bottom:6px}
.tb{display:grid;grid-template-columns:1fr auto;column-gap:12px}
.tb div{padding:12px 0;border-top:1px solid var(--hair)}
.tb div:nth-child(2n){text-align:right;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.tb div:nth-child(-n+2){border-top:0}
.gl div:nth-child(2n){color:var(--ink);font-weight:700}

/* dock Liquid Glass */
nav.tabs{position:fixed;z-index:5;left:50%;bottom:calc(env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);width:calc(100% - 32px);max-width:420px;padding:6px;border-radius:34px;background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.04);backdrop-filter:blur(22px) saturate(190%) brightness(1.04);
  box-shadow:inset 0 1px 0 var(--glass-edge),inset 0 -1px 0 var(--glass-low),inset 0 0 0 1px var(--glass-low),var(--glass-shadow);overflow:hidden;
  transition:opacity .3s ease,transform .45s var(--spring)}
nav.tabs::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 45%),radial-gradient(120% 60% at 50% -20%,rgba(255,255,255,.25),transparent 60%);mix-blend-mode:soft-light}
body.inquiz nav.tabs{opacity:0;pointer-events:none;transform:translate(-50%,30px) scale(.94)}
nav.tabs .in{position:relative;display:grid;grid-template-columns:repeat(5,1fr)}
.ind{position:absolute;top:0;bottom:0;left:0;width:20%;pointer-events:none;transition:transform .55s var(--spring)}
.ind::before{content:"";position:absolute;inset:0 3px;border-radius:28px;background:var(--accent-soft);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.08),0 2px 8px rgba(0,32,91,.08)}
.tab{position:relative;z-index:1;background:none;border:0;border-radius:28px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;letter-spacing:.1px;color:var(--muted);transition:color .3s ease}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .45s var(--spring)}
.tab[aria-current="page"]{color:var(--link)}
.tab[aria-current="page"] svg{stroke-width:2.2;transform:translateY(-1px) scale(1.08)}
.tab:active svg{transform:scale(.88)}

/* feuille modale */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,20,60,.35);display:flex;align-items:flex-end;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.sheet .card{width:100%;max-width:464px;border-radius:28px;text-align:center;box-shadow:var(--shadow-hi)}

/* pressions */
.btn,.opt,.mod,.les,.tile,.back{transition:transform .35s var(--spring),box-shadow .2s ease,background-color .2s ease,border-color .2s ease}
.btn:active:not([disabled]),.mod:active,.opt:active:not([disabled]),.cont:active{transform:scale(.97)}
.les:active{background:var(--surface2)}

@media (prefers-reduced-motion: no-preference){
  .v-fwd{animation:vFwd .42s var(--ease) both} .v-back{animation:vBack .42s var(--ease) both}

}
.rnav{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;margin-top:20px}

.ready{display:flex;flex-direction:column}

/* ===== v3 : parcours, stories, jeux, croquis ===== */

/* accueil */

.pnode{position:absolute;width:68px;height:68px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--surface);color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:24px;z-index:2;
  box-shadow:0 6px 0 rgba(0,32,91,.12),var(--shadow);border:1px solid var(--hair)}

.pnode.cur::after{content:"";position:absolute;inset:-10px;border-radius:inherit;border:2px solid var(--accent);opacity:.6;animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:.7}to{transform:scale(1.25);opacity:0}}
.pnode:active{transform:translateY(4px)} .pnode.quiz:active{transform:rotate(45deg) translateY(4px)}
.plabel{position:absolute;max-width:150px;font-size:13px;font-weight:600;color:var(--muted);line-height:1.25;z-index:1}
.plabel.l{text-align:right}
.plabel em{display:block;font-style:normal;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--link)}

/* stories */
.story{display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top) - 60px)}
.st-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.st-top .back{font-size:20px;padding:6px 10px 6px 0}
.st-segs{flex:1;display:flex;gap:4px}
.st-segs i{flex:1;height:4px;border-radius:9px;background:var(--line);overflow:hidden;position:relative}
.st-segs i.done{background:var(--accent)} .st-segs i.cur{background:var(--accent);opacity:.55}
.story-stage{flex:1;display:flex;cursor:pointer;-webkit-user-select:none;user-select:none}
.story-card{flex:1;background:var(--surface);border:1px solid var(--hair);border-radius:28px;padding:26px 22px;box-shadow:var(--shadow-hi);display:flex;flex-direction:column;justify-content:center;min-height:440px}
.story-card.in-r{animation:inR .38s var(--ease) both} .story-card.in-l{animation:inL .38s var(--ease) both}

.st-ill{width:120px;height:120px;margin-bottom:8px}

/* jeux */
.gtile{border:1px solid var(--hair);font:inherit;color:inherit;cursor:pointer;align-items:flex-start}
.gtile b{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.3px}
.gic{font-size:32px;line-height:1}

.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bucket{min-height:74px;border-radius:20px;border:1.5px solid var(--hair);background:var(--surface);font-weight:700;font-size:15px;box-shadow:var(--shadow);transition:transform .35s var(--spring)}

.bucket.b0{border-top:4px solid #4a9eed} .bucket.b1{border-top:4px solid #8b5cf6} .bucket.b2{border-top:4px solid #22c55e} .bucket.b3{border-top:4px solid var(--accent)}

.slots li.fill{border-style:solid;border-color:var(--good);background:var(--good-bg);animation:pop .4s var(--spring)}
.slots li.fill span{background:var(--good);color:#fff}
.chips2{display:flex;flex-wrap:wrap;gap:8px}

.pb{min-height:56px;border:1.5px solid var(--hair);background:var(--surface);border-radius:16px;padding:10px 12px;font-weight:600;font-size:15px;box-shadow:var(--shadow);transition:transform .3s var(--spring),background-color .2s ease}
.pb.sel{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.03)}
.pb.m{border-color:transparent;box-shadow:none;opacity:.9}
.pb.m0{background:#a5d8ff;color:#00205B} .pb.m1{background:#b2f2bb;color:#00205B} .pb.m2{background:#fff3bf;color:#00205B} .pb.m3{background:#d0bfff;color:#00205B} .pb.m4{background:#ffc9c9;color:#00205B}
.swzone{position:relative;padding:0 0 4px}
.swhint{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-display);font-weight:800;font-size:15px;opacity:.25;z-index:0}
.swhint.l{left:-4px;color:var(--bad-ink)} .swhint.r{right:-4px;color:var(--good-ink)}
.swcard{position:relative;z-index:1;touch-action:pan-y;cursor:grab;transition:transform .3s var(--spring)}
.swbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.swno{color:var(--bad-ink)!important} .swyes{color:var(--good-ink)!important}
.flip{perspective:1200px;margin:16px 0;cursor:pointer}
.fin{position:relative;min-height:280px;transition:transform .6s var(--spring);transform-style:preserve-3d}
.flip.on .fin{transform:rotateY(180deg)}
.ff,.fb2{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;gap:12px;box-shadow:var(--shadow-hi)}

@media (prefers-reduced-motion: reduce){.pnode.cur::after,.tile.streak.on .flame{animation:none}}

<div class="app">
  <header class="top" id="hdr"><span>Cap Scrum · PSM 1 · PSPO 1</span><h1 id="htitle">Accueil</h1></header>

</div>

<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script>
(function(){
"use strict";

/* ===================== COURS ===================== */
var MODS = [
{n:"Les fondamentaux",s:"Empirisme, valeurs, artefacts, Definition of Done",L:[
 {t:"Scrum en une minute",min:3,b:[
  ["p","Scrum est un cadre de travail léger qui aide des personnes, des équipes et des organisations à créer de la valeur grâce à des solutions adaptatives à des problèmes complexes."],
  ["p","Il est volontairement incomplet : il donne les règles du jeu (responsabilités, événements, artefacts) mais pas les pratiques. User stories, story points, burndown : rien de tout cela n’est obligatoire."],
  ["ex","Dans une migration ERP, Scrum ne te dit pas comment paramétrer le plan comptable. Il te dit comment organiser l’équipe pour livrer par petits morceaux utiles, et ajuster en route."],
  ["key",["Scrum repose sur l’empirisme et le lean thinking (réduire le gaspillage, se concentrer sur l’essentiel)","Cadre léger, volontairement incomplet","Le Scrum Guide 2020 est la seule référence de l’examen"]],
  ["trap","Une réponse qui impose une pratique précise (« les user stories sont obligatoires ») est presque toujours fausse."]]},
 {t:"L’empirisme et ses 3 piliers",min:4,b:[
  ["p","L’empirisme, c’est décider à partir de ce qu’on observe plutôt que de ce qu’on avait prévu. Il repose sur trois piliers."],
  ["defs",[["Transparence","Le travail et les artefacts sont visibles par ceux qui font le travail et ceux qui le reçoivent."],["Inspection","On examine souvent les artefacts et la progression pour détecter les écarts."],["Adaptation","Si un écart dépasse les limites acceptables, on ajuste dès que possible."]]],
  ["ex","Tu migres un client de Sage vers ACD. Au 2e Sprint, la reprise révèle des comptes auxiliaires mal codés. Transparence : l’anomalie est visible sur le tableau. Inspection : on la repère au Daily. Adaptation : on revoit le plan pour traiter le mapping d’abord."],
  ["p","Sans transparence, l’inspection trompe et l’adaptation devient du hasard. Les événements Scrum sont justement les moments d’inspection et d’adaptation."],
  ["trap","« Planification, contrôle, reporting » sonne sérieux mais décrit la gestion de projet classique, pas l’empirisme."]]},
 {t:"Les 5 valeurs",min:3,b:[
  ["p","L’équipe Scrum s’engage à vivre cinq valeurs."],
  ["defs",[["Engagement","Atteindre ses objectifs et se soutenir mutuellement."],["Focus","Se concentrer sur le travail du Sprint."],["Ouverture","Sur le travail et sur les difficultés rencontrées."],["Respect","Se considérer comme des professionnels capables et indépendants."],["Courage","Faire ce qui est juste et s’attaquer aux problèmes difficiles."]]],
  ["ex","Dire au Product Owner que la reprise des immobilisations ne tiendra pas dans le Sprint, c’est du courage et de l’ouverture. Le cacher jusqu’à la Review, c’est l’inverse."],
  ["trap","Ne confonds pas les 5 valeurs avec les 3 piliers de l’empirisme. En anglais : Commitment, Focus, Openness, Respect, Courage."]]},
 {t:"Artefacts et engagements",min:4,b:[
  ["p","Chaque artefact a un engagement. Il renforce la transparence et donne un repère pour mesurer la progression."],
  ["pairs",[["Artefact","Engagement"],["Product Backlog","Product Goal"],["Sprint Backlog","Sprint Goal"],["Incrément","Definition of Done"]]],
  ["p","Le Product Goal est l’objectif à long terme du produit. Le Sprint Goal est l’unique objectif du Sprint. La Definition of Done décrit l’état de qualité exigé pour l’Incrément."],
  ["ex","Product Goal : « Tous les dossiers du cabinet tournent sur ACD avant la clôture annuelle. » Sprint Goal : « Les 20 dossiers BIC sont repris avec des balances équilibrées. »"],
  ["key",["Un seul Product Goal à la fois","Le Sprint Goal est créé pendant la Sprint Planning","Plusieurs Incréments peuvent être créés dans un même Sprint"]]]},
 {t:"La Definition of Done",min:4,b:[
  ["p","La Definition of Done (DoD) décrit formellement l’état de l’Incrément quand il atteint la qualité requise. Dès qu’un élément du Product Backlog respecte la DoD, un Incrément est né."],
  ["p","Si la DoD est un standard de l’organisation, toutes les équipes la suivent au minimum. Sinon, l’équipe Scrum crée une DoD adaptée au produit. Les Developers doivent s’y conformer."],
  ["ex","DoD d’une migration : balance d’ouverture équilibrée, totaux contrôlés par journal, déclaration de TVA test générée, validation par le comptable du dossier."],
  ["key",["Ce qui ne respecte pas la DoD n’est ni présenté en Review, ni livré","Plusieurs équipes sur un même produit partagent la même DoD","La DoD peut se renforcer (souvent en Rétrospective), jamais s’assouplir pour « finir à tout prix »"]],
  ["trap","Les parties prenantes ne définissent pas la DoD, et le Scrum Master ne « valide » pas l’Incrément."]]}
]},
{n:"Rôles et responsabilités",s:"Product Owner, Scrum Master, Developers",L:[
 {t:"L’équipe Scrum",min:4,b:[
  ["p","Une équipe Scrum, c’est un Scrum Master, un Product Owner et des Developers. Pas de sous-équipes, pas de hiérarchie. Elle compte généralement 10 personnes ou moins."],
  ["key",["Pluridisciplinaire : elle a toutes les compétences pour créer de la valeur à chaque Sprint","Auto-gérée : elle décide en interne qui fait quoi, quand et comment","Responsable de toutes les activités liées au produit"]],
  ["ex","Pour une migration : un consultant fonctionnel, un comptable référent, un profil technique pour les imports. Si l’équipe dépend d’un autre service pour chaque reprise, elle n’est pas vraiment pluridisciplinaire."],
  ["p","Si l’équipe devient trop grande, elle se réorganise en plusieurs équipes Scrum centrées sur le même produit : même Product Goal, même Product Backlog, même Product Owner."],
  ["trap","Le Guide 2020 ne parle plus de « 3 à 9 Developers ». Retiens : 10 personnes ou moins, en général."]]},
 {t:"Le Product Owner",min:4,b:[
  ["p","Il est responsable de maximiser la valeur du produit issue du travail de l’équipe, et de la gestion efficace du Product Backlog."],
  ["key",["Développer et communiquer explicitement le Product Goal","Créer et communiquer clairement les éléments du Product Backlog","Ordonner les éléments du Product Backlog","S’assurer que le Product Backlog est transparent, visible et compris"]],
  ["p","Il peut déléguer ce travail, mais il en reste responsable. C’est une seule personne, pas un comité. Pour changer le Product Backlog, il faut convaincre le Product Owner."],
  ["ex","Le directeur du cabinet veut passer la reprise de la paie avant la compta. Il ne modifie pas le backlog lui-même : il en parle au Product Owner, qui tranche."],
  ["trap","Seul le Product Owner peut annuler un Sprint."]]},
 {t:"Les Developers",min:3,b:[
  ["p","Ce sont les personnes qui créent n’importe quel aspect d’un Incrément utilisable à chaque Sprint. « Developer » ne veut pas dire informaticien : un consultant ou un comptable peut en être un."],
  ["key",["Créer le plan du Sprint, le Sprint Backlog","Instiller la qualité en respectant la Definition of Done","Adapter leur plan chaque jour vers le Sprint Goal","Se tenir mutuellement responsables, en professionnels"]],
  ["ex","Le Product Owner dit quoi migrer en priorité. Les Developers décident comment : scripts d’import, contrôles, ordre des dossiers."],
  ["trap","Personne, pas même le Scrum Master, ne dit aux Developers comment transformer le backlog en Incrément."]]},
 {t:"Le Scrum Master",min:5,b:[
  ["p","Il est responsable de l’efficacité de l’équipe Scrum et de la mise en place de Scrum tel que défini dans le Guide. C’est un vrai leader, qui sert l’équipe et l’organisation."],
  ["defs",[["Au service de l’équipe","Coacher l’auto-gestion et la pluridisciplinarité, faire retirer les obstacles, s’assurer que les événements ont lieu, sont positifs et respectent leur time-box."],["Au service du Product Owner","Aider à trouver des techniques pour le Product Goal et le Product Backlog, faciliter la collaboration avec les parties prenantes."],["Au service de l’organisation","Former et coacher l’adoption de Scrum, aider chacun à comprendre l’approche empirique, lever les barrières entre parties prenantes et équipes."]]],
  ["ex","Tu viens du suivi de projet : le réflexe serait d’assigner les tâches et de faire le reporting. En Scrum, le Scrum Master aide l’équipe à s’organiser elle-même et à rendre son travail transparent."],
  ["trap","Le Scrum Master n’est ni chef de projet, ni manager, ni validateur. Toute réponse où il « décide », « assigne » ou « approuve » est suspecte."]]}
]},
{n:"Événements et time-boxes",s:"Sprint, Planning, Daily, Review, Rétrospective",L:[
 {t:"Le Sprint, conteneur de tout",min:4,b:[
  ["p","Le Sprint est un événement de durée fixe, d’un mois maximum, qui contient tous les autres événements. Un nouveau Sprint commence immédiatement après la fin du précédent."],
  ["key",["Aucun changement qui mettrait le Sprint Goal en danger","La qualité ne diminue pas","Le Product Backlog est affiné au besoin","Le périmètre peut être clarifié et renégocié avec le Product Owner"]],
  ["p","Un Sprint peut être annulé si son Sprint Goal devient obsolète. Seul le Product Owner peut le faire."],
  ["ex","Le client annonce qu’il change de logiciel cible en plein Sprint. Le Sprint Goal « reprendre les dossiers sur ACD » n’a plus de sens : le Product Owner peut annuler le Sprint."],
  ["trap","Un Sprint ne se prolonge jamais. Ce qui n’est pas terminé retourne dans le Product Backlog."]]},
 {t:"La Sprint Planning",min:4,b:[
  ["p","Elle lance le Sprint. Toute l’équipe Scrum y travaille et peut inviter d’autres personnes pour des conseils. Time-box : 8 h maximum pour un Sprint d’un mois."],
  ["defs",[["Pourquoi ce Sprint a-t-il de la valeur ?","Le Product Owner propose comment augmenter la valeur. L’équipe définit ensemble le Sprint Goal."],["Que peut-on terminer ?","Les Developers choisissent les éléments du Product Backlog, en échangeant avec le Product Owner."],["Comment le faire ?","Les Developers planifient le travail, souvent découpé en tâches d’un jour ou moins."]]],
  ["p","Sprint Goal + éléments choisis + plan pour les livrer = le Sprint Backlog."],
  ["trap","Ce sont la capacité et la performance passée des Developers qui guident la sélection, pas une demande du management."]]},
 {t:"Le Daily Scrum",min:3,b:[
  ["p","15 minutes, chaque jour du Sprint, à la même heure et au même endroit pour simplifier. Il sert à inspecter la progression vers le Sprint Goal et à adapter le Sprint Backlog."],
  ["p","C’est l’événement des Developers. Si le Product Owner ou le Scrum Master travaillent activement sur des éléments du Sprint Backlog, ils y participent en tant que Developers."],
  ["ex","Le format « hier j’ai fait, aujourd’hui je fais » n’est pas obligatoire. L’équipe peut s’organiser autour du tableau : quels dossiers bloquent la reprise ?"],
  ["key",["15 minutes, quelle que soit la durée du Sprint","Ce n’est pas une réunion de reporting pour un manager","Les Developers se reparlent autant que nécessaire dans la journée"]]]},
 {t:"Sprint Review et Rétrospective",min:5,b:[
  ["defs",[["Sprint Review · 4 h max","L’équipe et les parties prenantes inspectent le résultat du Sprint et décident des prochaines adaptations. Le Product Backlog peut être ajusté. C’est une séance de travail, pas une présentation."],["Rétrospective · 3 h max","L’équipe Scrum inspecte sa façon de travailler : personnes, interactions, processus, outils, Definition of Done. Les améliorations les plus utiles peuvent entrer dans le Sprint Backlog suivant. Elle clôt le Sprint."]]],
  ["ex","En Review, le client voit les dossiers repris et signale qu’il lui faut l’analytique avant la TVA : le Product Backlog est réordonné. En Rétro, l’équipe décide d’automatiser le contrôle des balances."],
  ["trap","L’ordre : Planning, puis Daily chaque jour, puis Review, puis Rétrospective. La Rétro est le dernier événement du Sprint."]]},
 {t:"Le raffinement du backlog",min:3,b:[
  ["p","Le raffinement consiste à découper et préciser les éléments du Product Backlog : description, ordre, taille. C’est une activité continue, pas un événement Scrum."],
  ["p","Les Developers qui feront le travail sont responsables de l’estimation. Le Product Owner peut les aider à comprendre et à arbitrer."],
  ["key",["Pas de time-box officielle dans le Guide 2020","Les éléments en haut du backlog sont plus clairs et détaillés","Un élément est prêt quand il peut être Done dans un Sprint"]],
  ["trap","Il y a 5 événements : Sprint, Sprint Planning, Daily Scrum, Sprint Review, Rétrospective. Le raffinement n’en fait pas partie."]]}
]},
{n:"PSM 1 : le Scrum Master",s:"Coaching, obstacles, situations d’examen",L:[
 {t:"Servir plutôt que diriger",min:4,b:[
  ["p","À l’examen, la bonne réponse du Scrum Master est rarement « décider » ou « régler à la place de ». Elle est presque toujours : enseigner, coacher, faciliter ou rendre visible."],
  ["defs",[["Enseigner","Expliquer les règles de Scrum quand elles sont mal comprises."],["Coacher","Poser des questions pour que l’équipe trouve sa solution."],["Faciliter","Créer les conditions d’une bonne discussion, sans en imposer le résultat."],["Faire retirer les obstacles","Quand l’équipe ne peut pas les lever seule."]]],
  ["ex","Deux consultants se disputent sur la méthode de reprise. Le bon réflexe n’est pas de trancher : on laisse l’équipe chercher une solution, puis on aide si elle bloque."],
  ["trap","Repère les mots « first », « best », « most appropriate » : ils orientent vers l’option qui développe l’auto-gestion."]]},
 {t:"Les obstacles",min:3,b:[
  ["p","Un obstacle (impediment) est ce qui ralentit l’équipe et qu’elle ne peut pas résoudre seule. Le Scrum Master aide à le faire retirer."],
  ["ex","L’équipe attend depuis 4 jours un accès à la base Sage du client. Le Scrum Master va voir la DSI ou le client pour débloquer, sans attendre la Rétrospective."],
  ["key",["Les Developers résolvent d’abord ce qui est à leur portée","Le Scrum Master intervient quand c’est hors de leur portée","Un problème organisationnel récurrent se traite avec l’organisation"]],
  ["trap","« Le Scrum Master doit être présent au Daily » est faux : il s’assure que le Daily a lieu et que les Developers savent le tenir en 15 minutes."]]},
 {t:"Plusieurs équipes, un produit",min:3,b:[
  ["p","Quand plusieurs équipes Scrum travaillent sur un même produit, elles partagent un seul Product Backlog, un seul Product Goal et un seul Product Owner."],
  ["key",["Une Definition of Done commune","Un Incrément intégré et utilisable à chaque Sprint","Chaque équipe a son propre Sprint Backlog"]],
  ["ex","Trois équipes migrent les filiales d’un même groupe : un backlog unique, ordonné par un seul Product Owner, pour éviter que chaque équipe priorise dans son coin."]]},
 {t:"Mesures et pression du management",min:4,b:[
  ["p","La vélocité est un outil de prévision propre à une équipe. Elle n’est pas comparable entre équipes et ne mesure pas la valeur."],
  ["ex","Un associé veut classer les équipes selon les story points livrés. Le Scrum Master explique pourquoi c’est contre-productif et propose de regarder la valeur livrée au client."],
  ["key",["Burndown, story points, vélocité : pratiques facultatives","La qualité n’est jamais sacrifiée pour tenir une date","Le Scrum Master aide le management à comprendre l’empirisme"]],
  ["trap","Assouplir la Definition of Done en fin de Sprint pour « finir » est toujours une mauvaise réponse."]]}
]},
{n:"PSPO 1 : le Product Owner",s:"Valeur, backlog, prévision, parties prenantes",L:[
 {t:"Maximiser la valeur",min:3,b:[
  ["p","Le Product Owner est jugé sur la valeur que le produit apporte, pas sur le respect d’un plan. Il prend les décisions sur le produit, et l’organisation doit les respecter."],
  ["ex","Livrer en retard toutes les fonctionnalités prévues vaut moins que livrer tôt les trois qui font gagner du temps aux comptables chaque jour."],
  ["key",["Il est propriétaire de la valeur, pas scribe des demandes","Il a l’autorité sur le Product Backlog","Ses décisions se voient dans le contenu et l’ordre du backlog, et dans l’Incrément inspecté en Review"]]]},
 {t:"Product Goal et Product Backlog",min:4,b:[
  ["p","Le Product Backlog est une liste émergente et ordonnée de ce qui est nécessaire pour améliorer le produit. C’est l’unique source du travail de l’équipe Scrum."],
  ["p","Le Product Goal décrit un état futur du produit. Il est dans le Product Backlog, et le reste du backlog émerge pour l’atteindre. L’équipe atteint (ou abandonne) un objectif avant de passer au suivant."],
  ["key",["Un élément contient généralement une description, un ordre et une taille","Le format est libre : les user stories sont facultatives","Le backlog n’est jamais terminé, il évolue"]],
  ["ex","Product Goal : « Zéro saisie manuelle des relevés bancaires dans les dossiers du cabinet. » Éléments : connecteur bancaire, règles d’affectation, contrôle de rapprochement…"]]},
 {t:"Ordonner, estimer, prévoir",min:4,b:[
  ["p","Le Product Owner ordonne le backlog selon la valeur, le risque, les dépendances ou l’apprentissage. Les Developers signalent les dépendances techniques, le Product Owner décide."],
  ["p","Les Developers estiment la taille des éléments. Pour prévoir une date, on s’appuie sur ce qui a réellement été livré (burn-down, burn-up, flux cumulé). Ces outils ne remplacent pas l’empirisme : seul le passé est connu."],
  ["ex","Le client veut une date de fin. Le Product Owner montre le rythme des 4 derniers Sprints sur un burn-up, et explique que la prévision sera revue à chaque Review."],
  ["trap","Le Guide dit « ordonner », pas « prioriser par la valeur » : l’ordre peut tenir compte d’autres critères."]]},
 {t:"Valeur, livraison et parties prenantes",min:4,b:[
  ["p","La valeur se mesure côté client : usage, satisfaction, gain de temps, revenu. Scrum.org propose l’Evidence-Based Management (EBM) avec 4 domaines : valeur actuelle, valeur non réalisée, délai de mise sur le marché, capacité à innover."],
  ["p","Le Product Owner peut livrer un Incrément quand il le juge utile, même plusieurs fois dans un Sprint. La Sprint Review n’est pas une porte de livraison."],
  ["ex","Le connecteur bancaire est Done mercredi : le Product Owner peut le mettre en production sans attendre la Review de vendredi."],
  ["key",["Le Product Owner représente les besoins des parties prenantes dans le backlog","La Review est le moment clé pour collaborer avec elles","Story points et heures travaillées ne mesurent pas la valeur"]]]}
]},
{n:"Examens blancs",s:"Le jour J et les épreuves chronométrées",exam:true,L:[
 {t:"Le jour J",min:3,b:[
  ["defs",[["Format","80 questions en 60 minutes, soit environ 45 secondes par question."],["Seuil","85 %, donc au moins 68 bonnes réponses sur 80."],["Types de questions","Choix unique, choix multiples, vrai ou faux."],["Langue","Anglais (ou japonais et chinois). Pas de version française."]]],
  ["p","L’examen se passe en ligne sur scrum.org, quand tu veux. Avant de payer, fais les tests gratuits Scrum Open et Product Owner Open sur scrum.org, jusqu’à obtenir 100 % plusieurs fois de suite."],
  ["key",["Ne bloque jamais plus d’une minute : marque la question et reviens-y","Lis jusqu’au bout : « first », « best », « most » changent tout","Pour les choix multiples, le nombre de réponses attendues est indiqué","Révise le lexique anglais dans l’onglet Fiches"]],
  ["trap","Avoir le Scrum Guide ouvert ne t’aidera pas : il n’y a pas le temps de chercher. Il faut le connaître."]]},
 {t:"Utiliser les examens blancs",min:2,b:[
  ["p","Le mode réel reproduit l’examen : 80 questions en anglais en 60 minutes, des questions à marquer, une vue d’ensemble pour revenir en arrière, et la correction en français à la fin. Les examens blancs rapides (40 questions en français, 30 minutes) servent à s’échauffer."],
  ["key",["Vise 85 % trois fois de suite en mode réel avant de passer la certification","Relis chaque erreur et son explication","Refais le module concerné si un thème reste faible"]]]}
]}
];

/* ===================== QUESTIONS ===================== */
// m = module, a = index ou tableau (choix multiples), d = numéro au diagnostic
var QS = [
 // Module 1
 {m:0,d:14,q:"Quels sont les trois piliers de l’empirisme dans Scrum ?",o:["Planification, contrôle, reporting","Transparence, inspection, adaptation","Engagement, courage, respect","Rôles, événements, artefacts"],a:1,w:"Transparence, inspection, adaptation. Les valeurs sont : engagement, focus, ouverture, respect, courage."},
 {m:0,d:4,q:"À quel artefact est rattaché l’engagement « Product Goal » ?",o:["Le Sprint Backlog","L’Incrément","Le Product Backlog","La Definition of Done"],a:2,w:"Product Backlog → Product Goal. Sprint Backlog → Sprint Goal. Incrément → Definition of Done."},
 {m:0,d:9,q:"Si la Definition of Done n’est pas un standard de l’organisation, qui la crée ?",o:["Le Product Owner seul","Le Scrum Master","L’équipe Scrum","Les parties prenantes"],a:2,w:"L’équipe Scrum la crée, et les Developers doivent s’y conformer. Si l’organisation a un standard, il s’applique au minimum."},
 {m:0,d:12,q:"À la fin du Sprint, l’Incrément doit être…",o:["Validé par le Scrum Master","Livré obligatoirement en production","Utilisable, donc conforme à la Definition of Done","Approuvé par toutes les parties prenantes"],a:2,w:"Utilisable, donc conforme à la Definition of Done. Le Product Owner décide ensuite de le livrer ou non."},
 {m:0,q:"Scrum est fondé sur l’empirisme et sur…",o:["Le lean thinking","Le cycle en V","La méthode PERT","Le modèle en cascade"],a:0,w:"Le lean thinking : réduire le gaspillage et se concentrer sur l’essentiel."},
 {m:0,q:"Vrai ou faux : le Scrum Guide décrit en détail les pratiques techniques à utiliser.",o:["Vrai","Faux"],a:1,tf:true,w:"Faux. Scrum est volontairement incomplet : il définit le cadre, pas les pratiques."},
 {m:0,q:"Lesquelles font partie des valeurs de Scrum ?",o:["Focus","Rapidité","Ouverture","Hiérarchie"],a:[0,2],w:"Les 5 valeurs : engagement, focus, ouverture, respect, courage."},
 {m:0,q:"Que se passe-t-il au moment où un élément du Product Backlog respecte la Definition of Done ?",o:["Un Incrément est né","Il doit d’abord être validé par le Product Owner","Il ne compte qu’après la Sprint Review","Il est livré automatiquement en production"],a:0,w:"Le Guide est explicite : dès qu’un élément respecte la DoD, un Incrément est né."},
 {m:0,q:"Trois équipes Scrum travaillent sur le même produit. Que dire de leur Definition of Done ?",o:["Chaque équipe a la sienne","Elles partagent une Definition of Done commune","Seule l’équipe la plus expérimentée en a une","Elle est fixée par le management"],a:1,w:"Une seule DoD pour un même produit, à laquelle toutes les équipes se conforment."},
 {m:0,q:"Le Sprint Goal est l’engagement de quel artefact ?",o:["Product Backlog","Sprint Backlog","Incrément","Aucun"],a:1,w:"Sprint Backlog → Sprint Goal."},
 // Module 2
 {m:1,d:2,q:"Qui est responsable de l’ordonnancement des éléments du Product Backlog ?",o:["Le Scrum Master","Les Developers","Le Product Owner","Les parties prenantes"],a:2,w:"Le Product Owner. Il peut déléguer le travail, mais il en reste responsable."},
 {m:1,d:6,q:"Qui décide de la manière de transformer les éléments du Product Backlog en Incrément ?",o:["Le Product Owner","Les Developers","Le Scrum Master","Le responsable hiérarchique"],a:1,w:"Les Developers sont auto-gérés : le « quoi » vient du Product Owner, le « comment » vient d’eux."},
 {m:1,d:10,q:"Quelle affirmation décrit le mieux le rôle du Scrum Master ?",o:["Il assigne les tâches aux Developers","Il est responsable de l’efficacité de l’équipe Scrum","Il est le chef de projet de l’équipe","Il valide l’Incrément avant la Review"],a:1,w:"Un leader au service de l’équipe : il coache, enseigne et fait retirer les obstacles."},
 {m:1,d:11,q:"Le Product Owner est…",o:["Un comité représentant les parties prenantes","Une seule personne","Le Scrum Master avec un autre chapeau","Le sponsor du projet"],a:1,w:"Une seule personne, jamais un comité. Elle peut représenter les besoins de nombreuses parties prenantes."},
 {m:1,q:"Quelle taille recommande le Scrum Guide 2020 pour une équipe Scrum ?",o:["3 à 9 Developers","Généralement 10 personnes ou moins","Exactement 7 personnes","Aucune limite"],a:1,w:"Généralement 10 personnes ou moins. « 3 à 9 » vient d’une ancienne version du Guide."},
 {m:1,q:"Vrai ou faux : une équipe Scrum peut contenir une sous-équipe dédiée aux tests.",o:["Vrai","Faux"],a:1,tf:true,w:"Faux. Pas de sous-équipes ni de hiérarchie dans une équipe Scrum."},
 {m:1,q:"Qui crée le plan du Sprint, c’est-à-dire le Sprint Backlog ?",o:["Le Product Owner","Le Scrum Master","Les Developers","Le management"],a:2,w:"Les Developers créent le plan du Sprint."},
 {m:1,q:"Lesquelles sont des responsabilités des Developers ?",o:["Créer le plan du Sprint","Instiller la qualité en respectant la Definition of Done","Ordonner le Product Backlog","Annuler le Sprint"],a:[0,1],w:"Ordonner le backlog et annuler un Sprint relèvent du Product Owner."},
 {m:1,q:"Un directeur veut faire remonter un élément du Product Backlog. Que doit-il faire ?",o:["Le déplacer lui-même","Demander au Scrum Master de le faire","Convaincre le Product Owner","Attendre la Rétrospective"],a:2,w:"Pour changer le Product Backlog, on convainc le Product Owner."},
 // Module 3
 {m:2,d:1,q:"Quelle est la durée maximale d’un Sprint ?",o:["2 semaines","1 mois","6 semaines","Fixée par le Scrum Master"],a:1,w:"Un mois maximum. L’équipe Scrum choisit la durée, souvent 2 semaines."},
 {m:2,d:3,q:"Qui peut annuler un Sprint ?",o:["Le Scrum Master","Le Product Owner","Les Developers","Le management"],a:1,w:"Seul le Product Owner, par exemple quand le Sprint Goal devient obsolète."},
 {m:2,d:7,q:"Combien de temps dure au maximum un Daily Scrum ?",o:["15 minutes","30 minutes","1 heure","Cela dépend de la durée du Sprint"],a:0,w:"15 minutes, quelle que soit la durée du Sprint."},
 {m:2,d:8,q:"Quel événement sert à inspecter l’Incrément avec les parties prenantes et à adapter le Product Backlog ?",o:["Sprint Planning","Sprint Review","Sprint Retrospective","Daily Scrum"],a:1,w:"La Sprint Review, une séance de travail avec les parties prenantes."},
 {m:2,d:13,q:"Quelle est la durée maximale de la Sprint Planning pour un Sprint d’un mois ?",o:["2 heures","4 heures","8 heures","1 journée complète"],a:2,w:"8 h. Pour un Sprint d’un mois : Planning 8 h, Review 4 h, Rétrospective 3 h, Daily 15 min."},
 {m:2,d:15,q:"La fin du Sprint arrive et un élément du Sprint Backlog n’est pas terminé. Que fait-on ?",o:["On prolonge le Sprint de quelques jours","Il n’entre pas dans l’Incrément et retourne dans le Product Backlog","On le déclare Done quand même","Le Scrum Master décide"],a:1,w:"Un Sprint n’est jamais prolongé. Ce qui ne respecte pas la DoD retourne dans le Product Backlog."},
 {m:2,d:5,q:"En plein Sprint, une partie prenante demande une fonctionnalité urgente. Que fait-on ?",o:["On l’ajoute, le client est roi","Le Scrum Master décide","On n’y touche jamais avant la fin du Sprint","Le périmètre peut être renégocié avec le Product Owner, sans mettre le Sprint Goal en danger"],a:3,w:"Le Sprint Goal ne change pas, mais le périmètre peut être clarifié et renégocié avec le Product Owner."},
 {m:2,q:"Quel événement clôt le Sprint ?",o:["Sprint Review","Daily Scrum","Sprint Retrospective","Sprint Planning"],a:2,w:"La Rétrospective est le dernier événement du Sprint."},
 {m:2,q:"Vrai ou faux : le raffinement du Product Backlog est un événement Scrum.",o:["Vrai","Faux"],a:1,tf:true,w:"Faux. C’est une activité continue. Les 5 événements sont : Sprint, Planning, Daily, Review, Rétrospective."},
 {m:2,q:"Quels sujets la Sprint Planning aborde-t-elle ?",o:["Pourquoi ce Sprint a de la valeur","Ce qui peut être terminé","Comment le travail sera fait","Le budget du trimestre"],a:[0,1,2],w:"Pourquoi (Sprint Goal), quoi (éléments choisis), comment (plan)."},
 {m:2,q:"Le Scrum Master travaille sur un élément du Sprint Backlog. Participe-t-il au Daily Scrum ?",o:["Non, jamais","Oui, en tant que Developer","Oui, pour l’animer obligatoirement","Seulement si le Product Owner l’invite"],a:1,w:"S’il travaille activement sur des éléments du Sprint Backlog, il participe en tant que Developer."},
 {m:2,q:"Quand commence le Sprint suivant ?",o:["Après une semaine de pause","Immédiatement après la fin du précédent","Quand le Product Owner le décide","Après validation du management"],a:1,w:"Un nouveau Sprint commence immédiatement après la fin du précédent."},
 // Module 4
 {m:3,q:"Deux Developers sont en désaccord sur la façon de réaliser une tâche. Que fait d’abord le Scrum Master ?",o:["Il tranche pour gagner du temps","Il remonte le conflit au manager","Il laisse l’équipe essayer de le résoudre, et coache si besoin","Il retire l’un des deux de l’équipe"],a:2,w:"Priorité à l’auto-gestion : l’équipe essaie d’abord, le Scrum Master coache si elle bloque."},
 {m:3,q:"L’équipe est bloquée par un accès que seul le service informatique peut donner. Quelle est la meilleure réponse ?",o:["Le Scrum Master aide à faire retirer l’obstacle avec l’organisation","Le Product Owner l’ajoute au backlog","Les Developers attendent la Rétrospective","On prolonge le Sprint"],a:0,w:"C’est un obstacle hors de portée de l’équipe : le Scrum Master aide à le faire retirer."},
 {m:3,q:"Le management veut comparer la vélocité de trois équipes. Que fait le Scrum Master ?",o:["Il fournit le classement demandé","Il explique que la vélocité n’est pas comparable entre équipes","Il demande aux équipes d’harmoniser leurs estimations","Il refuse sans explication"],a:1,w:"La vélocité est propre à chaque équipe. Le Scrum Master enseigne pourquoi, et oriente vers la valeur."},
 {m:3,q:"Au Daily, chaque Developer fait son point au Scrum Master. Quelle est la meilleure action ?",o:["Continuer, c’est efficace","Coacher les Developers pour qu’ils s’approprient le Daily","Remplacer le Daily par un e-mail","Demander au Product Owner d’animer"],a:1,w:"Le Daily appartient aux Developers. Ce n’est pas un reporting au Scrum Master."},
 {m:3,q:"Plusieurs équipes Scrum développent le même produit. Combien de Product Backlog ?",o:["Un par équipe","Un seul","Un par Sprint","Autant que de Product Owners"],a:1,w:"Un seul Product Backlog, un seul Product Goal, un seul Product Owner."},
 {m:3,q:"Vrai ou faux : le Scrum Master doit être présent au Daily Scrum.",o:["Vrai","Faux"],a:1,tf:true,w:"Faux. Il s’assure que le Daily a lieu, mais il n’est pas tenu d’y assister."},
 {m:3,q:"En fin de Sprint, les Developers proposent d’alléger la Definition of Done pour terminer. Que répondre ?",o:["D’accord, exceptionnellement","Non : la qualité ne diminue pas, le travail non terminé retourne au backlog","Le Product Owner décide seul","On prolonge le Sprint à la place"],a:1,w:"La qualité ne diminue pas pendant un Sprint. On ne baisse jamais la DoD pour finir."},
 {m:3,q:"Comment le Scrum Master sert-il l’organisation ?",o:["En menant, formant et coachant l’adoption de Scrum","En aidant chacun à comprendre l’approche empirique","En validant les congés de l’équipe","En fixant les objectifs individuels"],a:[0,1],w:"Il forme, coache et aide l’organisation à comprendre l’empirisme. Il n’est pas manager."},
 {m:3,q:"Comment le Scrum Master aide-t-il le Product Owner ?",o:["En ordonnant le backlog à sa place","En l’aidant à trouver des techniques pour le Product Goal et le Product Backlog","En validant ses décisions","En représentant les parties prenantes"],a:1,w:"Il aide le Product Owner à trouver des techniques, sans décider à sa place."},
 {m:3,q:"Qui participe à la Sprint Retrospective ?",o:["Les Developers uniquement","L’équipe Scrum : Product Owner, Scrum Master et Developers","Les parties prenantes","Le management"],a:1,w:"Toute l’équipe Scrum inspecte sa façon de travailler."},
 // Module 5
 {m:4,q:"De quoi le Product Owner est-il responsable avant tout ?",o:["Respecter le planning initial","Maximiser la valeur du produit","Rédiger toutes les user stories","Gérer l’équipe"],a:1,w:"Maximiser la valeur du produit issue du travail de l’équipe Scrum."},
 {m:4,q:"Combien de Product Goals l’équipe poursuit-elle à la fois ?",o:["Un seul","Un par Sprint","Autant que nécessaire","Un par partie prenante"],a:0,w:"Un seul. Il doit être atteint ou abandonné avant de passer au suivant."},
 {m:4,q:"Comment sont les éléments en haut du Product Backlog ?",o:["Plus vagues","Plus clairs et détaillés","Tous de même taille","Déjà terminés"],a:1,w:"Les éléments du haut sont plus clairs et détaillés, car ils seront traités bientôt."},
 {m:4,q:"Qui est responsable d’estimer la taille des éléments du Product Backlog ?",o:["Le Product Owner","Le Scrum Master","Les Developers qui feront le travail","Les parties prenantes"],a:2,w:"Les Developers. Le Product Owner peut les aider à comprendre et à arbitrer."},
 {m:4,q:"Vrai ou faux : on ne peut livrer un Incrément qu’à la Sprint Review.",o:["Vrai","Faux"],a:1,tf:true,w:"Faux. Un Incrément peut être livré avant la fin du Sprint. La Review n’est pas une porte de livraison."},
 {m:4,q:"Quel indicateur reflète le mieux la valeur d’un produit ?",o:["L’usage et la satisfaction des clients","Le nombre de story points livrés","Le respect du plan initial","Les heures travaillées"],a:0,w:"La valeur se mesure côté client. Story points et heures mesurent l’activité, pas la valeur."},
 {m:4,q:"Les Developers signalent qu’un élément peu prioritaire doit être fait avant un autre, pour des raisons techniques. Qui décide de l’ordre ?",o:["Les Developers","Le Product Owner, en tenant compte de la dépendance","Le Scrum Master","Le client"],a:1,w:"Le Product Owner ordonne le backlog en intégrant les dépendances signalées."},
 {m:4,q:"Comment le Product Owner prévoit-il au mieux une date de livraison ?",o:["Avec un planning détaillé fait au début","À partir de ce qui a réellement été livré (burn-up par exemple)","En demandant une promesse aux Developers","En ajoutant 20 % de marge"],a:1,w:"Prévision empirique : on s’appuie sur le passé réel et on revoit la prévision à chaque Sprint."},
 {m:4,q:"Que contient généralement un élément du Product Backlog ?",o:["Une description","Un ordre","Une taille","Le nom du Developer assigné"],a:[0,1,2],w:"Description, ordre et taille. Personne n’est assigné à l’avance."},
 {m:4,q:"Quels sont les domaines de l’Evidence-Based Management ?",o:["Valeur actuelle, valeur non réalisée, délai de mise sur le marché, capacité à innover","Coût, délai, périmètre, qualité","Vélocité, burndown, story points, heures","Satisfaction, budget, risques, planning"],a:0,w:"EBM : Current Value, Unrealized Value, Time to Market, Ability to Innovate."}
];

/* ===================== QUIZ ===================== */
function startQuiz(ids,opt){
  quiz={ids:ids,pos:0,sel:[],locked:false,ans:[],opts:{},title:opt.title,kind:opt.kind,mod:opt.mod,exam:!!opt.exam,examKey:opt.examKey,deadline:opt.sec?Date.now()+opt.sec*1000:null};
  ids.forEach(function(id){var q=QS[id];quiz.opts[id]=q.tf?[0,1]:shuffle(q.o.map(function(_,i){return i;}));});
  if(quiz.deadline){clearInterval(timerId);timerId=setInterval(tick,1000);}
  render();
}
function examIds(k){
  var pool, extra;
  if(k==="psm"){pool=QFR.filter(function(q){return q.m<=3;}); extra=QFR.filter(function(q){return q.m===4;});}
  else{pool=QFR.filter(function(q){return q.m===4;}).concat(shuffle(QFR.filter(function(q){return q.m<=2;})).slice(0,30)); extra=QFR.filter(function(q){return q.m===3;});}
  var ids=shuffle(pool.map(function(q){return q.id;})).slice(0,40);
  if(ids.length<40) ids=ids.concat(shuffle(extra.map(function(q){return q.id;})).slice(0,40-ids.length));
  return shuffle(ids);
}
function fmt(s){s=Math.max(0,s);var m=Math.floor(s/60),r=s%60;return m+":"+(r<10?"0":"")+r;}
function tick(){
  if(!quiz||!quiz.deadline){clearInterval(timerId);return;}
  var left=Math.round((quiz.deadline-Date.now())/1000), el=$("#timer");
  if(el){el.textContent=fmt(left); el.classList.toggle("low",left<=120);}
  if(left<=0){clearInterval(timerId); finishQuiz(true);}
}
function isRight(q,ans){
  if(isMulti(q)){if(ans.length!==q.a.length)return false; return q.a.every(function(x){return ans.indexOf(x)>-1;});}
  return ans[0]===q.a;
}
function renderQuiz(){
  view.classList.remove("v-fwd","v-back","v-fade","v-up");
  if(quiz.done) return renderResult();
  var id=quiz.ids[quiz.pos], q=QS[id], L=["A","B","C","D"], multi=isMulti(q), need=multi?q.a.length:1;
  var segs=quiz.ids.map(function(_,k){
    var c=""; if(k<quiz.ans.length){c=quiz.exam?"ans":(quiz.ans[k].ok?"ok":"ko");} else if(k===quiz.pos)c="cur";
    return '<i class="'+c+'"></i>';}).join("");
  var opts=quiz.opts[id].map(function(oi,k){
    var cls="opt", dis="";
    if(quiz.locked){dis=" disabled"; var correct=multi?q.a.indexOf(oi)>-1:oi===q.a, picked=quiz.sel.indexOf(oi)>-1;
      if(correct)cls+=" ok"; else if(picked)cls+=" ko";}
    else if(quiz.sel.indexOf(oi)>-1) cls+=" sel";
    return '<button class="'+cls+'" data-opt="'+oi+'"'+dis+' aria-pressed="'+(quiz.sel.indexOf(oi)>-1)+'"><span class="l">'+(q.tf?(q.en?(oi===0?"T":"F"):(oi===0?"V":"F")):L[k])+'</span><span>'+q.o[oi]+'</span></button>';}).join("");
  var hint = q.en ? (multi?"Choose "+need+" answers.":(q.tf?"True or false.":"Choose the best answer.")) : multi ? "Choix multiples : sélectionne "+need+" réponses." : (q.tf?"Vrai ou faux.":(quiz.exam?"Une seule réponse.":"Une seule réponse. Touche pour répondre."));
  var actions="";
  if(quiz.locked){
    var ok=quiz.ans[quiz.ans.length-1].ok;
    var good=multi?q.a.map(function(i){return q.o[i];}).join(" · "):q.o[q.a];
    actions='<div class="feedback '+(ok?"good":"bad")+'"><b class="v">'+(ok?"✅ Exact":"❌ Raté")+'</b>'+(ok?"":'<p style="margin:0 0 6px"><b>Bonne réponse :</b> '+good+'</p>')+'<p style="margin:0">'+q.w+'</p></div>'+
      '<div class="actions"><button class="btn primary" data-act="next">'+(quiz.pos===quiz.ids.length-1?"Voir mon résultat":"Question suivante")+'</button></div>';
  } else if(multi || quiz.exam){
    actions='<div class="actions"><button class="btn primary" data-act="validate"'+(quiz.sel.length===need?'':' disabled')+'>'+(quiz.exam?(quiz.pos===quiz.ids.length-1?"Terminer l’examen":"Suivante"):"Valider")+'</button></div>';
  }
  var timer = quiz.deadline ? '<span class="timer" id="timer">'+fmt(Math.round((quiz.deadline-Date.now())/1000))+'</span>' : '';
  view.innerHTML='<div class="qbar"><button class="back" data-act="quit">✕ Quitter</button>'+timer+'<span class="mono muted">'+(quiz.pos+1)+' / '+quiz.ids.length+'</span></div>'+
   '<div class="segs" aria-hidden="true">'+segs+'</div>'+
   '<span class="pill">'+(quiz.exam?quiz.title:MODS[q.m].n)+'</span>'+
   '<div class="qtext">'+q.q+'</div><div class="qhint">'+hint+'</div><div class="opts">'+opts+'</div>'+actions;
  tick();
}
function commit(){
  var id=quiz.ids[quiz.pos], q=QS[id], ok=isRight(q,quiz.sel);
  quiz.ans.push({id:id,sel:quiz.sel.slice(),ok:ok}); stat(q.m,ok); if(ok&&!quiz.exam) addXP(5);
  if(quiz.exam){advance();} else {quiz.locked=true; renderQuiz(); var f=$(".feedback"); if(f&&f.scrollIntoView)f.scrollIntoView({block:"nearest",behavior:"smooth"});}
}
function advance(){
  quiz.pos++; quiz.sel=[]; quiz.locked=false;
  if(quiz.pos>=quiz.ids.length){finishQuiz(false);return;}
  renderQuiz(); animateView("v-fwd"); window.scrollTo(0,0);
}
function finishQuiz(timeout){
  clearInterval(timerId);
  // questions sans réponse (temps écoulé) comptées fausses
  for(var k=quiz.ans.length;k<quiz.ids.length;k++) quiz.ans.push({id:quiz.ids[k],sel:[],ok:false,skip:true});
  var r=quiz.ans.filter(function(a){return a.ok;}).length, n=quiz.ids.length, pct=Math.round(r/n*100);
  quiz.done=true; quiz.timeout=timeout; quiz.r=r;
  if(quiz.kind==="mod"){S.best[quiz.mod]=Math.max(S.best[quiz.mod]||0,pct);}
  if(quiz.kind==="exam"){S.exams.push({k:quiz.title,r:r,n:n,date:today()}); addXP(r*3);}
  if(quiz.kind==="diag"){S.diag={r:r,date:today()};}
  save(); render(); animateView("v-up");
}
function renderResult(){
  var n=quiz.ids.length, r=quiz.r, pct=Math.round(r/n*100), wrong=quiz.ans.filter(function(a){return !a.ok;});
  var byMod={}; wrong.forEach(function(a){var m=QS[a.id].m; byMod[m]=(byMod[m]||0)+1;});
  var weak=Object.keys(byMod).sort(function(a,b){return byMod[b]-byMod[a];});
  var verdict = pct>=85 ? "Seuil atteint, bravo !" : "Il te manque "+(Math.ceil(n*0.85)-r)+" bonne(s) réponse(s) pour atteindre 85 %.";
  var review = wrong.map(function(a){var q=QS[a.id];
     var good=isMulti(q)?q.a.map(function(i){return q.o[i];}).join(" · "):q.o[q.a];
     var mine=a.skip?"Pas de réponse":(a.sel.map(function(i){return q.o[i];}).join(" · ")||"Pas de réponse");
     return '<details><summary>'+q.q+'</summary><div class="dbody"><p><b>Ta réponse :</b> '+mine+'</p><p><b>Bonne réponse :</b> '+good+'</p><p class="muted" style="margin:0">'+q.w+'</p></div></details>';}).join("");
  view.innerHTML='<div class="card score"><div class="tag">'+quiz.title+(quiz.timeout?" · temps écoulé":"")+'</div>'+
    '<div class="big"><b>'+pct+' %</b><small>'+r+' / '+n+'</small></div>'+
    '<div><div class="meter"><i style="width:'+pct+'%"></i><u style="left:85%"></u></div><div class="meter-legend"><span>0</span><span>seuil 85 %</span><span>100</span></div></div>'+
    '<p style="margin:0">'+verdict+'</p>'+
    (weak.length?'<p style="margin:0"><b>À revoir :</b> '+weak.map(function(m){return MODS[m].n+" ("+byMod[m]+")";}).join(", ")+'.</p>':'')+'</div>'+
    '<div class="actions">'+(wrong.length?'<button class="btn primary" data-act="retry-wrong">Rejouer mes '+wrong.length+' erreurs</button>':'')+
    '<button class="btn" data-act="close">Terminer</button></div>'+
    (wrong.length?'<h2>Correction de tes erreurs</h2>'+review:'');
}

var LEVELS=[[0,"Curieux"],[100,"Developer"],[300,"Scrum Master"],[700,"Product Owner"],[1200,"Coach Agile"]];
function dayNum(){var t=new Date();return Math.floor((t.getTime()-t.getTimezoneOffset()*60000)/864e5);}
function level(){var x=S.xp||0,i=0;for(var k=0;k<LEVELS.length;k++) if(x>=LEVELS[k][0]) i=k;
  var nxt=LEVELS[i+1]; return {i:i,name:LEVELS[i][1],next:nxt?nxt[1]:null,pct:nxt?Math.round((x-LEVELS[i][0])/(nxt[0]-LEVELS[i][0])*100):100,toNext:nxt?nxt[0]-x:0};}
function streak(){var s=S.streak; if(!s) return 0; var t=dayNum(); return (s.d===t||s.d===t-1)?s.n:0;}
function addXP(n){ if(!n) return; S.xp=(S.xp||0)+n; var t=dayNum(), s=S.streak;
  if(!s) S.streak={d:t,n:1}; else if(s.d!==t){ S.streak={d:t,n:(s.d===t-1?s.n+1:1)}; }
  S.hiStreak=Math.max(S.hiStreak||0,S.streak.n); save(); xpToast(n); }
function xpToast(n){var e=document.createElement("div");e.className="xptoast";e.textContent="+"+n+" XP";document.body.appendChild(e);setTimeout(function(){e.remove();},1300);}

function mastered(){var n=0;for(var k in S.cards) if(S.cards[k].box>=4) n++; return n;}
function badges(){var mods=0;for(var i=0;i<5;i++) if(modDone(i)) mods++;
  var realBest=0; S.exams.forEach(function(e){if(e.k.indexOf("mode réel")>-1) realBest=Math.max(realBest,e.r/e.n);});
  var hs=S.hiStreak||0;
  return [
   {n:"Première leçon",ic:"📖",ok:totalRead()>=1},
   {n:"Module validé",ic:"🏅",ok:mods>=1},
   {n:"3 jours de suite",ic:"🔥",ok:hs>=3},
   {n:"7 jours de suite",ic:"⚡",ok:hs>=7},
   {n:"Tous les jeux",ic:"🎮",ok:["who","order","pairs","swipe"].every(function(k){return S.games[k];})},
   {n:"20 cartes maîtrisées",ic:"🧠",ok:mastered()>=20},
