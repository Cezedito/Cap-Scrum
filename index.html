      '<div class="hero-num"><b id="cnt" data-to="'+pct+'">'+pct+' %</b><small>'+sc.r+' / '+sc.n+'</small></div>'+
      '<div><div class="meter" role="img" aria-label="Score '+pct+' pour cent, seuil 85 pour cent"><i style="width:'+pct+'%"></i><u style="left:85%"></u></div>'+
      '<div class="meter-legend"><span>0</span><span>seuil 85 %</span><span>100</span></div></div>'+
      '<p>'+(need?'Encore '+need+' bonne'+(need>1?'s':'')+' réponse'+(need>1?'s':'')+' pour atteindre le seuil.':'Seuil atteint. Confirme avec un examen réel.')+'</p></div>'+
    '<div class="tile"><span class="tag">Niveau '+(L.i+1)+'</span><div class="kpi" style="font-size:22px;letter-spacing:-.5px">'+L.name+'</div><div class="prog" style="margin-top:0"><i style="width:'+L.pct+'%"></i></div><span class="tag" style="font-weight:500">'+(S.xp||0)+' XP'+(L.next?' · '+L.toNext+' avant '+L.next:'')+'</span></div>'+
    '<div class="tile streak'+(st?' on':'')+'"><span class="flame" aria-hidden="true">🔥</span><div class="kpi">'+st+'<small>jour'+(st>1?'s':'')+'</small></div><span class="tag" style="font-weight:500">'+(st?'Série en cours. Reviens demain !':'Gagne de l’XP aujourd’hui pour lancer ta série.')+'</span></div>'+
    '<button class="tile cont span2" '+nx.act+'><span class="ico cta"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor" stroke="none"/></svg></span>'+
      '<span class="txt"><span class="tag">Continuer</span><b>'+nx.label+'</b></span><span class="chev" aria-hidden="true"></span></button>'+
    '<button class="tile cont span2" data-tab="jeux"><span class="ico">🃏</span><span class="txt"><span class="tag">Révision du jour</span><b>'+dueCards().length+' flashcards à revoir</b></span><span class="chev" aria-hidden="true"></span></button>'+
    '<div class="tile span2"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3 style="font-family:var(--f-display);font-weight:800;font-size:19px">Ta maîtrise par thème</h3><span class="tag">quiz et examens</span></div><svg id="radar" class="radar"></svg></div>'+
    renderReady()+
    '<div class="tile span2"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3 style="font-family:var(--f-display);font-weight:800;font-size:19px">Badges</h3><span class="pill '+(nb===B.length?'good':'neutral')+'">'+nb+' / '+B.length+'</span></div>'+
      '<div class="badges">'+B.map(function(b){return '<div class="badge'+(b.ok?' ok':'')+'"><span>'+b.ic+'</span><small>'+b.n+'</small></div>';}).join("")+'</div></div>'+
   '</div>';
  countUp(); drawRadar($("#radar"));
}

/* ===================== RENDU ===================== */
var prevPos=null;
function navPos(){
  if(quiz||REAL||GAME) return {d:3,k:"q"};
  if(tab==="cours"){ if(route.les!==null) return {d:2,k:"l",i:route.mod*100+route.les}; if(route.mod!==null) return {d:1,k:"m"}; }
  return {d:0,k:"t"+tab};
}
function animateView(cls){
  view.classList.remove("v-fwd","v-back","v-fade","v-up"); void view.offsetWidth; if(cls) view.classList.add(cls);
}
function render(){
  var np=navPos(), cls="v-fade";
  if(prevPos){
    if(np.d===3&&prevPos.d!==3) cls="v-up";
    else if(prevPos.d===3&&np.d!==3) cls="v-fade";
    else if(np.d>prevPos.d) cls="v-fwd";
    else if(np.d<prevPos.d) cls="v-back";
    else if(np.k==="l"&&prevPos.k==="l") cls=np.i>=prevPos.i?"v-fwd":"v-back";
    else if(np.k===prevPos.k) cls=null;
  }
  prevPos=np;
  var story=!quiz&&!REAL&&!GAME&&tab==="cours"&&route.les!==null;
  document.body.classList.toggle("inquiz",!!(quiz||REAL||GAME||story));
  $("#hdr").style.display=(quiz||REAL||GAME||story)?"none":"";
  renderTabs();
  var T={home:"Accueil",cours:"Mon parcours",jeux:"Jeux",exam:"Examens",fiches:"Fiches"}; $("#htitle").textContent=T[tab];
  if(REAL) renderReal();
  else if(GAME) renderGame();
  else if(quiz) renderQuiz();
  else if(tab==="home") renderHome();
  else if(tab==="cours") renderCours();
  else if(tab==="exam") renderExam();
  else if(tab==="jeux") renderJeux();
  else { renderFiches(); var mp=$("#map"); if(mp) drawSprintMap(mp,true); }
  animateView(cls);
}
function go(fn){fn(); render(); window.scrollTo(0,0);}
var tx0=null,ty0=null;
document.addEventListener("touchstart",function(e){var s=e.target.closest&&e.target.closest("#stage"); if(!s){tx0=null;return;} tx0=e.touches[0].clientX; ty0=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",function(e){if(tx0===null)return; var t=e.changedTouches[0],dx=t.clientX-tx0,dy=t.clientY-ty0; tx0=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){swallowClick=true; setTimeout(function(){swallowClick=false;},400); storyMove(dx<0?1:-1);}},{passive:true});
function closeSheet(){$("#sheet").innerHTML="";}

var swallowClick=false;
document.addEventListener("click",function(e){
  if(swallowClick){swallowClick=false;return;}
  var ev=e.target.closest&&e.target.closest("[data-ev]");
  if(ev){var k=ev.getAttribute("data-ev"),box=$("#mapinfo"); if(box){box.innerHTML=mapInfoHtml(k); box.classList.remove("pop"); void box.offsetWidth; box.classList.add("pop");}
    Array.prototype.forEach.call(document.querySelectorAll(".mapnode"),function(n){n.classList.toggle("on",n===ev);}); return;}
  var fl=e.target.closest&&e.target.closest("[data-g=flip]"); if(fl&&GAME&&GAME.t==="cards"){GAME.flip=!GAME.flip; renderGame(); return;}
  var stage=e.target.closest&&e.target.closest("#stage");
  if(stage&&!e.target.closest("button")){var r=stage.getBoundingClientRect(); storyMove(e.clientX<r.left+r.width*0.3?-1:1); return;}
  var el=e.target.closest("button"); if(!el) return;
  var d=el.dataset;
  if(d.tab){return go(function(){tab=d.tab; if(tab==="cours"){route={mod:null,les:null};}});}
  if(d.openMod!==undefined){return go(function(){tab="cours"; route={mod:+d.openMod,les:null};});}
  if(d.openLes){var p=d.openLes.split("-");return go(function(){tab="cours"; route={mod:+p[0],les:+p[1],card:0};});}
  if(d.doneLes){var q=d.doneLes.split("-"),mi=+q[0],li=+q[1]; if(!S.read[mi+"-"+li]){S.read[mi+"-"+li]=1; addXP(15);} save();
    if(li<MODS[mi].L.length-1) return go(function(){route.les=li+1;route.card=0;});
    if(MODS[mi].exam) return go(function(){route={mod:null,les:null};});
    route.les=null; return startQuizMod(mi);}
  if(d.back==="mods") return go(function(){route={mod:null,les:null};});
  if(d.back==="mod") return go(function(){route.les=null;});
  if(d.quizMod!==undefined) return startQuizMod(+d.quizMod);
  if(d.exam){var k=d.exam; return startQuiz(examIds(k),{title:k==="psm"?"Examen blanc PSM 1":"Examen blanc PSPO 1",kind:"exam",exam:true,sec:1800});}
  if(d.oscore){var inp=$("#os-"+d.oscore), v=inp?parseInt(inp.value,10):NaN;
    if(isNaN(v)||v<0||v>100){if(inp){inp.focus();inp.classList.add("err");} return;}
    (S.open[d.oscore]=S.open[d.oscore]||[]).push({p:v,date:today()}); save(); var yy=window.scrollY; renderExam(); window.scrollTo(0,yy); return;}
  if(d.story){var s=d.story;
    if(s==="next") return storyMove(1); if(s==="prev") return storyMove(-1);
    if(s==="restart"){route.card=0; route.cardDir="l"; renderLesson(route.mod,route.les); return;}
    if(s==="close") return go(function(){route={mod:null,les:null};});}
  if(d.game){startGame(d.game); return;}
  if(d.g&&GAME){var G=GAME;
    if(d.g==="quit"){GAME=null; render(); window.scrollTo(0,0); return;}
    if(d.g==="again"){var t=G.t; GAME=null; startGame(t); return;}
    if(d.g==="next"){
      if(G.t==="who"||G.t==="swipe"){G.pos++; G.fb=null;}
      if(G.t==="order"){ if(G.p===ORDERS.length-1){gameEnd("Séquences terminées",G.err?G.err+" erreur"+(G.err>1?"s":"")+" au total. Réessaie pour un sans-faute !":"Sans-faute, bravo !",Math.max(10,40-G.err*5)); return;} G.p++; G.placed=[]; G.pool=shuffle(ORDERS[G.p].i);}
      if(G.t==="pairs"){ if(G.p===PAIRS.length-1){gameEnd("Paires terminées",G.err?G.err+" erreur"+(G.err>1?"s":"")+" au total.":"Sans-faute, bravo !",Math.max(10,40-G.err*5)); return;} G.p++; G.done=[]; G.left=null; G.right=shuffle(PAIRS[G.p].p.map(function(x,i){return i;}));}
      renderGame(); animateView("v-fwd"); window.scrollTo(0,0); return;}
  }
  if(d.who!==undefined&&GAME&&!GAME.fb){var it=GAME.items[GAME.pos],ok=+d.who===it[1]; if(ok){GAME.ok++; addXP(3);} GAME.fb={ok:ok,pick:+d.who}; renderGame(); return;}
  if(d.ord&&GAME){var t=decodeURIComponent(d.ord),P=ORDERS[GAME.p],want=P.i[GAME.placed.length];
    if(t===want){GAME.placed.push(t); GAME.pool.splice(GAME.pool.indexOf(t),1); renderGame();} else {GAME.err++; shake(el);} return;}
  if(d.pl!==undefined&&GAME){GAME.left=+d.pl; renderGame(); return;}
  if(d.pr!==undefined&&GAME){ if(GAME.left===null){shake(el);return;}
    if(+d.pr===GAME.left){GAME.done.push(GAME.left); GAME.left=null; addXP(2); renderGame();} else {GAME.err++; shake(el);} return;}
  if(d.sw!==undefined&&GAME){swAnswer(+d.sw); return;}
  if(d.card!==undefined&&GAME){cardAnswer(d.card==="1"); return;}
  if(d.real){startReal(d.real); window.scrollTo(0,0); return;}
  if(d.rgo!==undefined && REAL){REAL.pos=+d.rgo; REAL.grid=false; renderReal(); animateView("v-fade"); window.scrollTo(0,0); return;}
  if(d.ropt!==undefined && REAL){
    var rq=QS[REAL.ids[REAL.pos]], ro=+d.ropt, cur=(REAL.ans[rq.id]||[]).slice();
    if(isMulti(rq)){var ri=cur.indexOf(ro); if(ri>-1)cur.splice(ri,1); else if(cur.length<rq.a.length)cur.push(ro);} else cur=[ro];
    REAL.ans[rq.id]=cur; var y=window.scrollY; renderReal(); window.scrollTo(0,y); return;}
  if(d.ract && REAL){
    var ra=d.ract;
    if(ra==="next"){ if(REAL.pos<REAL.ids.length-1){REAL.pos++; renderReal(); animateView("v-fwd");} else {REAL.grid=true; renderReal(); animateView("v-up");} window.scrollTo(0,0); return;}
    if(ra==="prev"){ if(REAL.pos>0){REAL.pos--; renderReal(); animateView("v-back"); window.scrollTo(0,0);} return;}
    if(ra==="grid"){REAL.grid=true; renderReal(); animateView("v-up"); window.scrollTo(0,0); return;}
    if(ra==="close-grid"){REAL.grid=false; renderReal(); animateView("v-fade"); window.scrollTo(0,0); return;}
    if(ra==="flag"){var fid=REAL.ids[REAL.pos]; REAL.flag[fid]=!REAL.flag[fid]; var y2=window.scrollY; renderReal(); window.scrollTo(0,y2); return;}
    if(ra==="finish"){var un=REAL.ids.length-realAnswered(), fl=REAL.ids.filter(function(id){return REAL.flag[id];}).length;
      $("#sheet").innerHTML='<div class="sheet"><div class="card"><h3>Terminer l’examen ?</h3><p class="muted">'+(un?un+' question'+(un>1?'s':'')+' sans réponse, comptée'+(un>1?'s':'')+' fausse'+(un>1?'s':'')+'. ':'Toutes les questions ont une réponse. ')+(fl?fl+' marquée'+(fl>1?'s':'')+'.':'')+'</p><div class="actions"><button class="btn primary" data-ract="finish-yes">Terminer et voir la correction</button><button class="btn" data-act="quit-no">Continuer l’examen</button></div></div></div>'; return;}
    if(ra==="finish-yes"){finishReal(false); return;}
    if(ra==="quit"){$("#sheet").innerHTML='<div class="sheet"><div class="card"><h3>Quitter l’examen ?</h3><p class="muted">Tes réponses seront perdues et l’examen ne sera pas noté.</p><div class="actions"><button class="btn primary" data-act="quit-yes">Quitter</button><button class="btn" data-act="quit-no">Continuer</button></div></div></div>'; return;}
  }
  if(d.opt!==undefined && quiz && !quiz.locked){
    var qq=QS[quiz.ids[quiz.pos]], oi=+d.opt;
    if(isMulti(qq)){var ix=quiz.sel.indexOf(oi); if(ix>-1)quiz.sel.splice(ix,1); else if(quiz.sel.length<qq.a.length) quiz.sel.push(oi); renderQuiz();}
    else if(quiz.exam){quiz.sel=[oi]; renderQuiz();}
    else {quiz.sel=[oi]; commit();}
    return;}
  var act=d.act;
  if(act==="validate"){commit();return;}
  if(act==="next"){advance();return;}
  if(act==="diag"){startQuiz(DIAG.slice(),{title:"Diagnostic",kind:"diag"});return;}
  if(act==="random"){startQuiz(shuffle(QFR.map(function(q){return q.id;})).slice(0,10),{title:"Série aléatoire",kind:"free"});return;}
  if(act==="random-en"){startQuiz(shuffle(QEN.map(function(q){return q.id;})).slice(0,10),{title:"Practice in English",kind:"free"});return;}
  if(act==="retry-wrong"){var w=quiz.ans.filter(function(a){return !a.ok;}).map(function(a){return a.id;}); startQuiz(shuffle(w),{title:"Mes erreurs",kind:"free"}); window.scrollTo(0,0); return;}
  if(act==="close"){quiz=null; clearInterval(timerId); render(); window.scrollTo(0,0); return;}
  if(act==="quit"){
    $("#sheet").innerHTML='<div class="sheet"><div class="card"><h3>Quitter '+(quiz.exam?"l’examen":"le quiz")+' ?</h3><p class="muted">Ta progression sur cette série sera perdue.</p><div class="actions"><button class="btn primary" data-act="quit-yes">Quitter</button><button class="btn" data-act="quit-no">Continuer</button></div></div></div>';
    return;}
  if(act==="quit-yes"){closeSheet(); quiz=null; REAL=null; GAME=null; clearInterval(timerId); clearInterval(realTimer); render(); window.scrollTo(0,0); return;}
  if(act==="quit-no"){closeSheet(); return;}
});
function startQuizMod(mi){
  var ids=shuffle(QFR.filter(function(q){return q.m===mi;}).map(function(q){return q.id;}));
  startQuiz(ids,{title:"Quiz · "+MODS[mi].n,kind:"mod",mod:mi}); window.scrollTo(0,0);
}

render();
})();
</script>
